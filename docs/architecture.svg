<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="640" viewBox="0 0 1080 640" font-family="Helvetica, Arial, sans-serif">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#475569"/>
    </marker>
    <marker id="arrowAmber" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#d97706"/>
    </marker>
  </defs>

  <rect width="1080" height="640" fill="#f8fafc"/>
  <text x="40" y="44" font-size="24" font-weight="bold" fill="#0f172a">Walk Me There — Architecture</text>
  <text x="40" y="68" font-size="14" fill="#475569">The engine knows where you are. The agent knows who you are.</text>

  <!-- ============ TRUTH PLANE ============ -->
  <rect x="40" y="92" width="440" height="440" rx="14" fill="#ecfdf5" stroke="#10b981" stroke-width="2"/>
  <text x="60" y="122" font-size="15" font-weight="bold" fill="#065f46">TRUTH PLANE — deterministic, on device</text>
  <text x="60" y="141" font-size="12" fill="#047857">No model is ever consulted about geography</text>

  <rect x="70" y="160" width="380" height="52" rx="8" fill="#ffffff" stroke="#94a3b8"/>
  <text x="90" y="182" font-size="14" font-weight="bold" fill="#0f172a">Browser Geolocation</text>
  <text x="90" y="200" font-size="12" fill="#475569">watchPosition — lat / lng / accuracy / speed / heading</text>

  <line x1="260" y1="212" x2="260" y2="238" stroke="#475569" stroke-width="2" marker-end="url(#arrow)"/>

  <rect x="70" y="240" width="380" height="72" rx="8" fill="#ffffff" stroke="#94a3b8"/>
  <text x="90" y="261" font-size="14" font-weight="bold" fill="#0f172a">Deterministic Navigation Engine</text>
  <text x="90" y="278" font-size="11" fill="#475569">haversine distance · bearing · cross-track · state machine</text>
  <text x="90" y="292" font-size="11" fill="#475569">UNCERTAIN_GPS · STATIONARY · ON_ROUTE ·</text>
  <text x="90" y="306" font-size="11" fill="#475569">WRONG_DIRECTION · OFF_ROUTE</text>

  <line x1="260" y1="312" x2="260" y2="338" stroke="#475569" stroke-width="2" marker-end="url(#arrow)"/>

  <rect x="70" y="340" width="380" height="60" rx="8" fill="#ffffff" stroke="#94a3b8"/>
  <text x="90" y="361" font-size="14" font-weight="bold" fill="#0f172a">Recovery Trigger + Verifier</text>
  <text x="90" y="378" font-size="11" fill="#475569">debounced WRONG_DIRECTION / OFF_ROUTE wakes the agent;</text>
  <text x="90" y="392" font-size="11" fill="#475569">stable return to ON_ROUTE closes the episode</text>

  <line x1="260" y1="400" x2="260" y2="422" stroke="#475569" stroke-width="2" marker-end="url(#arrow)"/>

  <rect x="70" y="424" width="380" height="84" rx="8" fill="#ffffff" stroke="#94a3b8"/>
  <text x="90" y="447" font-size="14" font-weight="bold" fill="#0f172a">Owl Companion UI</text>
  <text x="90" y="465" font-size="12" fill="#475569">state badge always rendered from the engine;</text>
  <text x="90" y="481" font-size="12" fill="#475569">validated agent speech overlays the dialogue;</text>
  <text x="90" y="497" font-size="12" fill="#475569">static state messages are the permanent fallback</text>

  <!-- ============ COMPANION PLANE (Google Cloud) ============ -->
  <rect x="560" y="92" width="480" height="440" rx="14" fill="#eff6ff" stroke="#3b82f6" stroke-width="2"/>
  <text x="580" y="122" font-size="15" font-weight="bold" fill="#1e3a8a">COMPANION PLANE — Google Cloud</text>
  <text x="580" y="141" font-size="12" fill="#1d4ed8">Understands the person. Never decides the route.</text>

  <rect x="590" y="160" width="420" height="88" rx="8" fill="#ffffff" stroke="#94a3b8"/>
  <text x="610" y="183" font-size="14" font-weight="bold" fill="#0f172a">Cloud Run — companion agent (Node + Express)</text>
  <text x="610" y="201" font-size="12" fill="#475569">Google GenAI SDK · POST /api/companion/turn</text>
  <text x="610" y="217" font-size="12" fill="#475569">computes landmark bearings deterministically,</text>
  <text x="610" y="233" font-size="12" fill="#475569">injects engine facts + user model into every turn</text>

  <line x1="700" y1="248" x2="700" y2="286" stroke="#475569" stroke-width="2" marker-end="url(#arrow)" marker-start="url(#arrow)"/>

  <rect x="590" y="288" width="200" height="88" rx="8" fill="#ffffff" stroke="#94a3b8"/>
  <text x="610" y="311" font-size="14" font-weight="bold" fill="#0f172a">Vertex AI</text>
  <text x="610" y="329" font-size="12" fill="#475569">Gemini 3.5 Flash</text>
  <text x="610" y="345" font-size="12" fill="#475569">guidance wording +</text>
  <text x="610" y="361" font-size="12" fill="#475569">update_user_model tool</text>

  <line x1="890" y1="248" x2="890" y2="286" stroke="#475569" stroke-width="2" marker-end="url(#arrow)" marker-start="url(#arrow)"/>

  <rect x="810" y="288" width="200" height="88" rx="8" fill="#ffffff" stroke="#94a3b8"/>
  <text x="830" y="311" font-size="14" font-weight="bold" fill="#0f172a">Firestore</text>
  <text x="830" y="329" font-size="12" fill="#475569">user model (how this</text>
  <text x="830" y="345" font-size="12" fill="#475569">person understands direction)</text>
  <text x="830" y="361" font-size="12" fill="#475569">+ recovery episodes</text>

  <rect x="590" y="400" width="420" height="108" rx="8" fill="#fffbeb" stroke="#d97706" stroke-width="2"/>
  <text x="610" y="424" font-size="14" font-weight="bold" fill="#92400e">Deterministic Validator — between model and screen</text>
  <text x="610" y="444" font-size="12" fill="#78350f">✕ no invented numbers   ✕ no landmarks outside the registry</text>
  <text x="610" y="462" font-size="12" fill="#78350f">✓ honors avoidCardinal learned from the user</text>
  <text x="610" y="480" font-size="12" fill="#78350f">rejected or timed-out speech → engine's static message;</text>
  <text x="610" y="496" font-size="12" fill="#78350f">navigation keeps working even if the model is down</text>

  <!-- cross-plane arrows -->
  <path d="M 450 368 H 505 V 204 H 585" fill="none" stroke="#475569" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="462" y="192" font-size="11" fill="#475569">engine facts +</text>
  <text x="462" y="206" font-size="11" fill="#475569">nav snapshot</text>

  <path d="M 585 454 H 455" fill="none" stroke="#d97706" stroke-width="2" marker-end="url(#arrowAmber)"/>
  <text x="468" y="444" font-size="11" fill="#92400e">validated</text>
  <text x="468" y="458" font-size="11" fill="#92400e">speech only</text>

  <path d="M 450 384 H 520 V 528 H 700 V 512" fill="none" stroke="#10b981" stroke-width="2" stroke-dasharray="6 4" marker-end="url(#arrow)"/>
  <text x="530" y="545" font-size="11" fill="#047857">only the engine certifies recovery → episode outcome = RECOVERED (the model cannot grade itself)</text>

  <!-- footer -->
  <text x="40" y="576" font-size="13" font-weight="bold" fill="#0f172a">Hard rule:</text>
  <text x="118" y="576" font-size="13" fill="#334155">geographic truth is deterministic; Gemini has no write path to coordinates, routes, states, or thresholds.</text>
  <text x="40" y="600" font-size="13" fill="#334155">Feedback loop: user says 「我分不清東西南北」 → Gemini calls update_user_model → Firestore → every future guidance changes.</text>
  <text x="40" y="624" font-size="12" fill="#64748b">Stack: Gemini 3.5 Flash (Vertex AI) · Google GenAI SDK · Cloud Run · Firestore — v0.1.6</text>
</svg>
